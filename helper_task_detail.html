<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SwaDrive | Task Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --primary:#4776E6;
  --gradient:linear-gradient(135deg,#4776E6,#8E54E9);
  --text:#2D3748;
  --muted:#718096;
  --bg:#F7FAFC;
  --card:#ffffff;
  --radius:14px;
  --shadow:0 10px 30px rgba(71,118,230,.15);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ---------- NAVBAR ---------- */
.navbar{
  background:#fff;
  padding:16px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.logo{
  font-family:'Montserrat',sans-serif;
  font-size:1.4rem;
  font-weight:700;
  text-decoration:none;
  color:var(--text);
}
.logo span{
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ---------- CONTAINER ---------- */
.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

/* ---------- CARD ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* ---------- HEADER ---------- */
.card-header{
  background:var(--gradient);
  color:#fff;
  padding:25px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.card-header h1{
  font-size:1.6rem;
  font-family:'Montserrat',sans-serif;
}
.status{
  background:rgba(255,255,255,.2);
  padding:6px 14px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:600;
}

/* ---------- CONTENT ---------- */
.card-body{
  padding:30px;
}
.section{
  margin-bottom:25px;
}
.section-title{
  font-family:'Montserrat',sans-serif;
  font-size:1.1rem;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:10px;
}
.section-title i{color:var(--primary)}
.row{
  display:flex;
  margin-bottom:10px;
}
.label{
  width:150px;
  color:var(--muted);
  font-weight:500;
}
.value{
  flex:1;
}

/* ---------- DESCRIPTION ---------- */
.description{
  background:#f1f5f9;
  padding:20px;
  border-radius:10px;
}

/* ---------- MAP ---------- */
.map{
  margin-top:15px;
  height:260px;
  border-radius:12px;
  overflow:hidden;
}
iframe{
  width:100%;
  height:100%;
  border:0;
}

/* ---------- BUTTONS ---------- */
.actions{
  display:flex;
  gap:15px;
  margin-top:30px;
  flex-wrap:wrap;
}
.btn{
  padding:12px 26px;
  border:none;
  border-radius:40px;
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
}
.btn-primary{
  background:var(--gradient);
  color:#fff;
}
.btn-outline{
  background:#fff;
  border:1px solid #ddd;
  color:var(--text);
}
.btn:hover{opacity:.9}

/* ---------- MOBILE ---------- */
@media(max-width:768px){
  .row{flex-direction:column}
  .label{width:auto;margin-bottom:4px}
  .card-header h1{font-size:1.3rem}
}





/* Quote Modal */
.quote-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.quote-modal {
  background: #fff;
  width: 100%;
  max-width: 420px;
  border-radius: 14px;
  padding: 22px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: slideUp 0.3s ease;
}

.quote-modal h2 {
  margin-bottom: 16px;
  font-size: 20px;
  color: #1f2937;
}

.quote-modal label {
  font-size: 14px;
  font-weight: 600;
  margin-top: 10px;
  display: block;
}

.quote-modal input,
.quote-modal textarea {
  width: 100%;
  padding: 10px 12px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  font-size: 14px;
}

.quote-modal textarea {
  resize: none;
  height: 70px;
}

.quote-total {
  margin-top: 14px;
  font-size: 16px;
  font-weight: 700;
  color: #2563eb;
}

.quote-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.btn-cancel {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #e5e7eb;
  font-weight: 600;
  cursor: pointer;
}

.btn-send {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #2563eb;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

@keyframes slideUp {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}






  
</style>
</head>

<body>

<nav class="navbar">
  <a href="tasks.html" class="logo">Swa<span>Drive</span></a>
</nav>

<div class="container">
  <div class="card">

    <div class="card-header">
      <h1 id="title">Loading...</h1>
      <div class="status" id="status">OPEN</div>
    </div>

    <div class="card-body">

      <div class="section">
        <div class="row"><div class="label">Urgency</div><div class="value" id="urgency">-</div></div>
        <div class="row"><div class="label">Reward</div><div class="value">₹ <span id="reward">0</span></div></div>
      </div>

      <div class="section">
        <div class="section-title"><i class="fas fa-align-left"></i>Description</div>
        <div class="description" id="description">-</div>
      </div>

      <div class="section">
        <div class="section-title"><i class="fas fa-map-marker-alt"></i>Location</div>
        <div class="row"><div class="label">Address</div><div class="value" id="location">-</div></div>
        <div class="map">
          <iframe id="map"></iframe>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-outline" onclick="history.back()">
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <button class="btn btn-primary" onclick="acceptTask()">
          <i class="fas fa-check"></i> Accept Task
        </button>

   <button class="primary-btn" onclick="openQuoteModal()">
  💰 Send Quote
</button>


        
          <button class="btn btn-primary" onclick="openChat()">
    <i class="fas fa-comments"></i> Chat with Customer
  </button>
       <button class="btn btn-primary" onclick="completeTask(taskId)">
  <i class="fas fa-check-circle"></i> Mark Completed
</button>

      </div>

    </div>
  </div>
</div>


  
<!-- Quote Modal -->
<div class="quote-modal-overlay" id="quoteModal">
  <div class="quote-modal">
    <h2>💰 Send Price Quote</h2>

    <label>Service Charge (₹) *</label>
    <input type="number" id="serviceCharge" placeholder="e.g. 300" required>

    <label>Parts Cost (₹) (optional)</label>
    <input type="number" id="partsCost" placeholder="e.g. 1500">

    <label>Estimated Reach Time (minutes)</label>
    <input type="number" id="reachTime" placeholder="e.g. 30">

    <label>Message to Customer (optional)</label>
    <textarea placeholder="Any notes for customer..."></textarea>

    <div class="quote-total">
      Total: ₹<span id="totalAmount">0</span>
    </div>

    <div class="quote-actions">
      <button class="btn-cancel" onclick="closeQuoteModal()">Cancel</button>
      <button class="btn-send" onclick="sendQuote()">Send Quote</button>
    </div>
  </div>
</div>

  
<script>
const BACKEND_URL="https://swadrive-backend-2bou.onrender.com";
const token=localStorage.getItem("token");
const params=new URLSearchParams(window.location.search);
const taskId=params.get("task_id");

if(!token){alert("Login first");location.href="login.html"}
if(!taskId){alert("Task id missing")}

async function loadTask(){
  const res=await fetch(`${BACKEND_URL}/api/helper/tasks/${taskId}`,{
    headers:{Authorization:"Bearer "+token}
  });
  if(!res.ok){alert("Failed to load task");return;}
  const t=await res.json();

  title.textContent=t.title;
  status.textContent=(t.status||"open").toUpperCase();
  urgency.textContent=t.urgency||"-";
  reward.textContent=t.reward_amount||0;
  description.textContent=t.description||"-";
  location.textContent=t.location||"-";

  if(t.location){
    map.src=`https://www.google.com/maps?q=${encodeURIComponent(t.location)}&output=embed`;
  }
}
  

  
async function acceptTask(){
  if(!confirm("Accept this task?"))return;
  const res=await fetch(`${BACKEND_URL}/api/tasks/${taskId}/accept`,{
    method:"POST",
    headers:{Authorization:"Bearer "+token}
  });
  const data=await res.json();
  if(!res.ok){alert(data.message||"Failed");return;}
  alert("Task accepted ✅");
  location.href="tasks.html";
}

loadTask();

  async function completeTask(taskId) {
  if (!confirm("✅ Are you sure you completed this task?")) return;

  const token = localStorage.getItem("token");
  if (!token) {
    alert("Login first");
    location.href = "login.html";
    return;
  }

  try {
    const res = await fetch(
      `${BACKEND_URL}/api/tasks/${taskId}/complete`,
      {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (!res.ok) {
      alert("❌ " + data.message);
      return;
    }

    alert("🎉 Task completed!");
    location.href = "helper_my_tasks.html";

  } catch (err) {
    alert("❌ Network error");
  }
}





  

  

function openQuoteModal() {
  document.getElementById("quoteModal").style.display = "flex";
}

function closeQuoteModal() {
  document.getElementById("quoteModal").style.display = "none";
}

const serviceInput = document.getElementById("serviceCharge");
const partsInput = document.getElementById("partsCost");

[serviceInput, partsInput].forEach(input => {
  input.addEventListener("input", calculateTotal);
});

function calculateTotal() {
  const service = Number(serviceInput.value) || 0;
  const parts = Number(partsInput.value) || 0;
  document.getElementById("totalAmount").innerText = service + parts;
}

async function sendQuote() {
  const service = Number(document.getElementById("serviceCharge").value);
  const parts = Number(document.getElementById("partsCost").value || 0);
  const reach = document.getElementById("reachTime").value;

  if (!service) {
    alert("Enter service charge");
    return;
  }

  if (!reach) {
    alert("Enter reach time");
    return;
  }

  const total = service + parts;

  try {
    const res = await fetch(`${BACKEND_URL}/api/send-quote`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify({
        task_id: taskId,
        price: total,
        reach_time: reach
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.message || "Failed to send quote");
      return;
    }

    alert("✅ Quote sent to customer");
    closeQuoteModal();

  } catch (err) {
    alert("❌ Network error");
  }
}

  





  
 
 



  

  // ---------------- OPEN CHAT ----------------
function openChat() {
  if (!taskId) {
    alert("Task id missing");
    return;
  }

  // chat.html page par le jaayega
  window.location.href = `chat.html?task_id=${taskId}`;
}
